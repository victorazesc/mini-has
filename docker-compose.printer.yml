name: mini-has

services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MINI_HAS_LAN_IP:-192.168.1.57}:1883:1883"
      - "${MINI_HAS_LAN_IP:-192.168.1.57}:9001:9001"
    volumes:
      - ./docker/mosquitto/prod.conf:/mosquitto/config/mosquitto.conf:ro
      - printer_mosquitto_data:/mosquitto/data
      - printer_mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./server/.env
      - ${MINI_HAS_RUNTIME_ENV_FILE:-./config/printer.env}
    environment:
      HOST: 127.0.0.1
      PORT: 8000
      MINI_HAS_DB: /app/data/mini-has.db
      MQTT_URL: mqtt://${MINI_HAS_LAN_IP:-192.168.1.57}:1883
      LOCAL_SUBNET_PREFIX: ${LOCAL_SUBNET_PREFIX:-192.168.1}
      MINI_HAS_TRUST_PROXY: "true"
      MINI_HAS_API_DOCS: "false"
      CAMERA_RECORDING_ENABLED: "false"
    volumes:
      - ./server/data:/app/data
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 300
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./client/.env
    environment:
      SERVER_URL: http://127.0.0.1:8000
      FLOOR_MODEL_UPLOAD_DIR: /app/uploads/floors
      NEXT_TELEMETRY_DISABLED: "1"
      MINI_HAS_SESSION_COOKIE: ${MINI_HAS_SESSION_COOKIE:-mini_has_session}
      MINI_HAS_CSRF_COOKIE: ${MINI_HAS_CSRF_COOKIE:-mini_has_xsrf}
    command:
      - npm
      - run
      - start
      - --
      - --hostname
      - ${MINI_HAS_LAN_IP:-192.168.1.57}
      - --port
      - "3000"
    volumes:
      - printer_client_uploads:/app/uploads/floors
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://${MINI_HAS_LAN_IP:-192.168.1.57}:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 300
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    profiles:
      - tunnel
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20241
      - --config
      - /home/nonroot/.cloudflared/config.yml
      - run
    volumes:
      - ./config/cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      client:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "cloudflared",
          "tunnel",
          "--metrics",
          "127.0.0.1:20241",
          "ready",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 100
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  printer_client_uploads:
  printer_mosquitto_data:
  printer_mosquitto_log:
